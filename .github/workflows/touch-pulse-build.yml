
name: Build TouchPulse APK
      - name: Show Kotlin error lines
        run: |
          nl -ba "$PROJECT_DIR/app/src/main/java/com/custom/touchpulse/alt/MainActivity.kt" | sed -n '135,155p'
on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -e
          unzip -q TouchPulsePressure-alt-src-v3.zip -d extracted

          PROJECT_DIR=$(find extracted -type f -name "settings.gradle.kts" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -print -quit | xargs dirname)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project structure not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchPulse-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
            extracted/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
