
name: Build TouchPulse APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -e
          unzip -q TouchPulsePressure-alt-src-v3.zip -d extracted

          PROJECT_DIR=$(find extracted -type f -name "settings.gradle.kts" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -print -quit | xargs dirname)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project structure not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix Kotlin string
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/TouchPulsePressure-alt-src-v3/app/src/main/java/com/custom/touchpulse/alt/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          old = '''"Шкала: 1.0 — %.1f | Сила: %.0f%%
          X: %.2fx | Y: %.2fx | Шаг: %.0f px",'''

          new = '"Шкала: 1.0 — %.1f | Сила: %.0f%%\\nX: %.2fx | Y: %.2fx | Шаг: %.0f px",'

          if old not in s:
              raise SystemExit("Ожидаемый ошибочный текст не найден!")

          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          print("Kotlin string successfully fixed")

          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchPulse-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
            extracted/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
